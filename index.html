<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JZA Applications</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1c1c1e;
    --muted: #6b6b70;
    --rule: #e4e4e7;
    --accent: #0a6cff;
    --card: #f7f7f8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111113;
      --fg: #f2f2f4;
      --muted: #a1a1a8;
      --rule: #2a2a2e;
      --accent: #6aa8ff;
      --card: #1a1a1d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 3rem 1.25rem 4rem;
    background: var(--bg);
    color: var(--fg);
    font: 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 640px; margin: 0 auto; }
  header { border-bottom: 1px solid var(--rule); padding-bottom: 1.5rem; margin-bottom: 2rem; }
  h1 { font-size: 2rem; line-height: 1.2; margin: 0 0 .4rem; letter-spacing: -0.02em; }
  .tagline { color: var(--muted); margin: 0; }
  h2 { font-size: 1.15rem; margin: 2.5rem 0 .75rem; letter-spacing: -0.01em; }
  p { margin: 0 0 1rem; }
  a { color: var(--accent); }
  .app {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 12px;
    padding: 1.25rem 1.35rem;
    margin-bottom: 1rem;
  }
  .app h3 { margin: 0 0 .3rem; font-size: 1.15rem; letter-spacing: -0.01em; }
  .app p { color: var(--muted); margin: 0 0 .9rem; }
  .links a { margin-right: 1.25rem; font-weight: 500; }
  footer {
    margin-top: 3.5rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--rule);
    color: var(--muted);
    font-size: .9rem;
  }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<main>

  <header>
    <h1>JZA Applications</h1>
    <p class="tagline">Small, private apps for iPhone and iPad.</p>
  </header>

  <h2>Apps</h2>

  <div class="app">
    <h3>BikeSpec</h3>
    <p>Bike details, setups, service records and photos — kept on your device and in your own iCloud.</p>
    <p class="links">
      <a href="bikespec/support.html">Support</a>
      <a href="BikeSpecPrivacyPolicy.html">Privacy policy</a>
    </p>
  </div>

  <h2>Contact</h2>
  <p>For anything at all: <a href="mailto:jza.applications@gmail.com">jza.applications@gmail.com</a></p>

  <footer>
    <p>&copy; 2026 JZA Applications</p>
  </footer>

</main>
</body>
</html>
